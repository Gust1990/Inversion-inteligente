<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversiones Inteligentes</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(30, 41, 59, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-green: #4ade80;
            --neon-red: #f87171;
            --btn-green: rgba(74, 222, 128, 0.2);
            --btn-red: rgba(248, 113, 113, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .header svg {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            fill: var(--text-main);
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Stats Globales */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .text-green { color: var(--neon-green); text-shadow: 0 0 8px rgba(74,222,128,0.4); }
        .text-red { color: var(--neon-red); text-shadow: 0 0 8px rgba(248,113,113,0.4); }

        /* Calculadora */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--text-muted);
        }

        .calc-results {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .result-item {
            text-align: center;
            flex: 1;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
        }

        .btn-win {
            background: var(--btn-green);
            border-color: var(--neon-green);
        }
        .btn-win:hover { background: rgba(74, 222, 128, 0.4); }

        .btn-loss {
            background: var(--btn-red);
            border-color: var(--neon-red);
        }
        .btn-loss:hover { background: rgba(248, 113, 113, 0.4); }

        /* Historial */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-title {
            font-size: 18px;
            font-weight: 600;
        }

        .btn-undo {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .btn-undo:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid transparent;
        }

        .item-win { border-left-color: var(--neon-green); }
        .item-loss { border-left-color: var(--neon-red); }

        .item-details h4 { font-size: 16px; margin-bottom: 4px; }
        .item-details p { font-size: 12px; color: var(--text-muted); }
        .item-amount { font-weight: bold; font-size: 16px; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Ícono Escudo Minimalista -->
        <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
        <h1>Inversiones Inteligentes</h1>
    </div>

    <!-- Panel de Estadísticas Globales -->
    <div class="glass-panel">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Capital Base</div>
                <div class="stat-value">1.000.000 ARS</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Balance Global Neto</div>
                <div class="stat-value" id="global-neto">0 ARS</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Operaciones Exitosas</div>
                <div class="stat-value text-green" id="global-wins">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Operaciones Fallidas</div>
                <div class="stat-value text-red" id="global-losses">0</div>
            </div>
        </div>
    </div>

    <!-- Panel de Operación -->
    <div class="glass-panel">
        <div class="input-group">
            <label>Activo (Ej: QQQ, SPY, GLD)</label>
            <input type="text" id="activo-nombre" placeholder="Nombre del ETF..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>Precio de Entrada (Por acción/Cedear)</label>
            <input type="number" id="precio-entrada" placeholder="0.00" step="any" autocomplete="off">
        </div>

        <div class="calc-results">
            <div class="result-item">
                <div class="stat-label">Stop Loss (-4%)</div>
                <div class="stat-value text-red" id="calc-sl">$0.00</div>
            </div>
            <div class="result-item">
                <div class="stat-label">Cantidad Aprox.</div>
                <div class="stat-value" id="calc-qty">0</div>
            </div>
            <div class="result-item">
                <div class="stat-label">Objetivo (+12%)</div>
                <div class="stat-value text-green" id="calc-tp">$0.00</div>
            </div>
        </div>

        <div class="btn-grid">
            <button class="btn-loss" onclick="registrarOperacion('loss')">Registrar Pérdida<br>(-$40.000)</button>
            <button class="btn-win" onclick="registrarOperacion('win')">Registrar Ganancia<br>(+$120.000)</button>
        </div>
    </div>

    <!-- Historial (Últimas 10) -->
    <div class="glass-panel">
        <div class="history-header">
            <div class="history-title">Últimas Operaciones (Top 10)</div>
            <button class="btn-undo" onclick="deshacerUltima()">⟲ Deshacer Última</button>
        </div>
        <ul class="history-list" id="history-list">
            <!-- Items generados por JS -->
        </ul>
    </div>
</div>

<script>
    // Variables y Constantes
    const CAPITAL = 1000000;
    const GANANCIA_ARS = 120000;
    const PERDIDA_ARS = -40000;

    // Cargar datos de LocalStorage
    let statsGlobales = JSON.parse(localStorage.getItem('ii_stats')) || { neto: 0, wins: 0, losses: 0 };
    let historial = JSON.parse(localStorage.getItem('ii_history')) || [];

    // Referencias DOM
    const inputPrecio = document.getElementById('precio-entrada');
    const inputActivo = document.getElementById('activo-nombre');
    const UI = {
        sl: document.getElementById('calc-sl'),
        tp: document.getElementById('calc-tp'),
        qty: document.getElementById('calc-qty'),
        neto: document.getElementById('global-neto'),
        wins: document.getElementById('global-wins'),
        losses: document.getElementById('global-losses'),
        list: document.getElementById('history-list')
    };

    // Formatear Moneda
    const formatMoney = (num) => new Intl.NumberFormat('es-AR').format(num);

    // Calcular en tiempo real
    inputPrecio.addEventListener('input', () => {
        const p = parseFloat(inputPrecio.value);
        if(p > 0) {
            UI.sl.innerText = '$' + (p * 0.96).toFixed(2);
            UI.tp.innerText = '$' + (p * 1.12).toFixed(2);
            UI.qty.innerText = Math.floor(CAPITAL / p);
        } else {
            UI.sl.innerText = '$0.00';
            UI.tp.innerText = '$0.00';
            UI.qty.innerText = '0';
        }
    });

    // Registrar Operación
    function registrarOperacion(resultado) {
        const activo = inputActivo.value.trim().toUpperCase() || 'ETF Desconocido';
        const precio = inputPrecio.value ? parseFloat(inputPrecio.value).toFixed(2) : 'N/A';
        const fecha = new Date().toLocaleDateString('es-AR');

        const operacion = {
            id: Date.now(),
            activo: activo,
            precio: precio,
            resultado: resultado,
            fecha: fecha,
            monto: resultado === 'win' ? GANANCIA_ARS : PERDIDA_ARS
        };

        // Actualizar Globales
        statsGlobales.neto += operacion.monto;
        if(resultado === 'win') statsGlobales.wins++;
        else statsGlobales.losses++;

        // Actualizar Historial (Agregar al principio y cortar en 10)
        historial.unshift(operacion);
        if(historial.length > 10) historial.pop();

        guardarDatos();
        actualizarPantalla();
        
        // Limpiar inputs
        inputActivo.value = '';
        inputPrecio.value = '';
        inputPrecio.dispatchEvent(new Event('input')); // resetear calculos
    }

    // Deshacer Última Operación
    function deshacerUltima() {
        if(historial.length === 0) return alert('No hay operaciones para deshacer.');
        
        if(confirm('¿Seguro que deseas borrar el último registro? Se restarán los valores del global.')) {
            const ultima = historial.shift(); // Saca el primero de la lista
            
            // Revertir stats
            statsGlobales.neto -= ultima.monto;
            if(ultima.resultado === 'win') statsGlobales.wins--;
            else statsGlobales.losses--;

            guardarDatos();
            actualizarPantalla();
        }
    }

    function guardarDatos() {
        localStorage.setItem('ii_stats', JSON.stringify(statsGlobales));
        localStorage.setItem('ii_history', JSON.stringify(historial));
    }

    function actualizarPantalla() {
        // Stats
        UI.neto.innerText = (statsGlobales.neto > 0 ? '+' : '') + formatMoney(statsGlobales.neto) + ' ARS';
        UI.neto.className = 'stat-value ' + (statsGlobales.neto >= 0 ? 'text-green' : 'text-red');
        UI.wins.innerText = statsGlobales.wins;
        UI.losses.innerText = statsGlobales.losses;

        // Historial
        UI.list.innerHTML = '';
        historial.forEach(op => {
            const isWin = op.resultado === 'win';
            const sign = isWin ? '+' : '';
            const amountClass = isWin ? 'text-green' : 'text-red';
            const itemClass = isWin ? 'item-win' : 'item-loss';

            UI.list.innerHTML += `
                <li class="history-item ${itemClass}">
                    <div class="item-details">
                        <h4>${op.activo}</h4>
                        <p>${op.fecha} | Entrada: $${op.precio}</p>
                    </div>
                    <div class="item-amount ${amountClass}">
                        ${sign}${formatMoney(op.monto)} ARS
                    </div>
                </li>
            `;
        });
    }

    // Iniciar
    actualizarPantalla();
</script>
</body>
</html>
