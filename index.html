<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversiones Inteligentes</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(30, 41, 59, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neon-green: #4ade80;
            --neon-red: #f87171;
            --neon-blue: #60a5fa;
            --btn-green: rgba(74, 222, 128, 0.2);
            --btn-red: rgba(248, 113, 113, 0.2);
            --btn-blue: rgba(96, 165, 250, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .header svg {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            fill: var(--text-main);
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Stats Globales */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }

        .text-green { color: var(--neon-green); text-shadow: 0 0 8px rgba(74,222,128,0.4); }
        .text-red { color: var(--neon-red); text-shadow: 0 0 8px rgba(248,113,113,0.4); }

        /* Inputs */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--text-muted);
        }

        .btn-full {
            width: 100%;
            padding: 15px;
            background: var(--btn-blue);
            border: 1px solid var(--neon-blue);
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-full:hover { background: rgba(96, 165, 250, 0.4); }

        /* Listas */
        .history-list {
            list-style: none;
        }

        .history-item {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 4px solid var(--border-color);
            overflow: hidden;
        }

        .item-active { border-left-color: var(--neon-blue); }
        .item-win { border-left-color: var(--neon-green); }
        .item-loss { border-left-color: var(--neon-red); }

        .item-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .item-details h4 { font-size: 16px; margin-bottom: 4px; }
        .item-details p { font-size: 12px; color: var(--text-muted); }
        .item-amount { font-weight: bold; font-size: 16px; }

        .item-targets {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(0,0,0,0.5);
            font-size: 13px;
        }

        .target-sl { color: var(--neon-red); }
        .target-tp { color: var(--neon-green); }

        .item-actions {
            display: flex;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .item-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: transparent;
            transition: background 0.2s;
        }

        .action-loss { color: var(--neon-red); border-right: 1px solid rgba(255,255,255,0.05); }
        .action-loss:hover { background: var(--btn-red); }
        .action-win { color: var(--neon-green); }
        .action-win:hover { background: var(--btn-green); }

        .btn-undo {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            font-size: 12px;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
        }
        
        .btn-undo:hover {
            color: var(--text-main);
            border-color: var(--text-main);
        }
        
        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 10px 0;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
        <h1>Inversiones Inteligentes</h1>
    </div>

    <!-- Stats Globales -->
    <div class="glass-panel">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Capital Base</div>
                <div class="stat-value">1.000.000 ARS</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Balance Global Neto</div>
                <div class="stat-value" id="global-neto">0 ARS</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Operaciones Exitosas</div>
                <div class="stat-value text-green" id="global-wins">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Operaciones Fallidas</div>
                <div class="stat-value text-red" id="global-losses">0</div>
            </div>
        </div>
    </div>

    <!-- Nueva Operación -->
    <div class="glass-panel">
        <div class="panel-title">Abrir Nueva Operación</div>
        <div class="input-group">
            <label>Activo (Ej: QQQ, SPY, GLD)</label>
            <input type="text" id="activo-nombre" placeholder="Nombre del ETF..." autocomplete="off">
        </div>
        <div class="input-group">
            <label>Precio de Entrada (Por acción/Cedear)</label>
            <input type="number" id="precio-entrada" placeholder="0.00" step="any" autocomplete="off">
        </div>
        <button class="btn-full" onclick="abrirOperacion()">Abrir Operación</button>
    </div>

    <!-- Operaciones Activas -->
    <div class="glass-panel">
        <div class="panel-title">Operaciones Activas</div>
        <ul class="history-list" id="activas-list">
            <!-- Items Activos JS -->
        </ul>
    </div>

    <!-- Historial -->
    <div class="glass-panel">
        <div class="panel-title">
            Historial (Top 10)
            <button class="btn-undo" onclick="deshacerUltima()">⟲ Deshacer Última</button>
        </div>
        <ul class="history-list" id="history-list">
            <!-- Items Historial JS -->
        </ul>
    </div>
</div>

<script>
    const GANANCIA_ARS = 120000;
    const PERDIDA_ARS = -40000;

    let statsGlobales = JSON.parse(localStorage.getItem('ii_stats')) || { neto: 0, wins: 0, losses: 0 };
    let activas = JSON.parse(localStorage.getItem('ii_activas')) || [];
    let historial = JSON.parse(localStorage.getItem('ii_history')) || [];

    const formatMoney = (num) => new Intl.NumberFormat('es-AR').format(num);
    const getFecha = () => new Date().toLocaleDateString('es-AR');

    function abrirOperacion() {
        const inputActivo = document.getElementById('activo-nombre');
        const inputPrecio = document.getElementById('precio-entrada');
        
        const activo = inputActivo.value.trim().toUpperCase();
        const p = parseFloat(inputPrecio.value);

        if(!activo || isNaN(p) || p <= 0) {
            alert('Por favor, ingresa un activo y un precio de entrada válido.');
            return;
        }

        const operacion = {
            id: Date.now(),
            activo: activo,
            precio: p.toFixed(2),
            sl: (p * 0.96).toFixed(2),
            tp: (p * 1.12).toFixed(2),
            fecha_apertura: getFecha()
        };

        activas.push(operacion);
        guardarDatos();
        actualizarPantalla();

        inputActivo.value = '';
        inputPrecio.value = '';
    }

    function cerrarOperacion(id, resultado) {
        const index = activas.findIndex(op => op.id === id);
        if(index === -1) return;

        const op = activas.splice(index, 1)[0]; // Sacar de activas
        
        // Completar datos de cierre
        op.resultado = resultado;
        op.fecha_cierre = getFecha();
        op.monto = resultado === 'win' ? GANANCIA_ARS : PERDIDA_ARS;

        // Actualizar Globales
        statsGlobales.neto += op.monto;
        if(resultado === 'win') statsGlobales.wins++;
        else statsGlobales.losses++;

        // Pasar al historial
        historial.unshift(op);
        if(historial.length > 10) historial.pop();

        guardarDatos();
        actualizarPantalla();
    }

    function deshacerUltima() {
        if(historial.length === 0) return alert('No hay operaciones recientes para deshacer.');
        
        if(confirm('¿Deshacer la última operación? Volverá al panel de "Activas".')) {
            const ultima = historial.shift(); // Sacar del historial
            
            // Revertir stats
            statsGlobales.neto -= ultima.monto;
            if(ultima.resultado === 'win') statsGlobales.wins--;
            else statsGlobales.losses--;

            // Limpiar datos de cierre y volver a activas
            delete ultima.resultado;
            delete ultima.fecha_cierre;
            delete ultima.monto;
            
            activas.push(ultima);

            guardarDatos();
            actualizarPantalla();
        }
    }

    function guardarDatos() {
        localStorage.setItem('ii_stats', JSON.stringify(statsGlobales));
        localStorage.setItem('ii_activas', JSON.stringify(activas));
        localStorage.setItem('ii_history', JSON.stringify(historial));
    }

    function actualizarPantalla() {
        // Stats Generales
        document.getElementById('global-neto').innerText = (statsGlobales.neto > 0 ? '+' : '') + formatMoney(statsGlobales.neto) + ' ARS';
        document.getElementById('global-neto').className = 'stat-value ' + (statsGlobales.neto >= 0 ? 'text-green' : 'text-red');
        document.getElementById('global-wins').innerText = statsGlobales.wins;
        document.getElementById('global-losses').innerText = statsGlobales.losses;

        // Lista Activas
        const listActivas = document.getElementById('activas-list');
        if(activas.length === 0) {
            listActivas.innerHTML = '<div class="empty-msg">No hay operaciones abiertas.</div>';
        } else {
            listActivas.innerHTML = '';
            activas.forEach(op => {
                listActivas.innerHTML += `
                    <li class="history-item item-active">
                        <div class="item-header">
                            <div class="item-details">
                                <h4>${op.activo}</h4>
                                <p>Abierta: ${op.fecha_apertura} | Precio: $${op.precio}</p>
                            </div>
                        </div>
                        <div class="item-targets">
                            <div class="target-sl">Vender Pérdida: $${op.sl}</div>
                            <div class="target-tp">Vender Ganancia: $${op.tp}</div>
                        </div>
                        <div class="item-actions">
                            <button class="action-loss" onclick="cerrarOperacion(${op.id}, 'loss')">Cerrar (-4%)</button>
                            <button class="action-win" onclick="cerrarOperacion(${op.id}, 'win')">Cerrar (+12%)</button>
                        </div>
                    </li>
                `;
            });
        }

        // Lista Historial
        const listHistorial = document.getElementById('history-list');
        if(historial.length === 0) {
            listHistorial.innerHTML = '<div class="empty-msg">El historial está vacío.</div>';
        } else {
            listHistorial.innerHTML = '';
            historial.forEach(op => {
                const isWin = op.resultado === 'win';
                const sign = isWin ? '+' : '';
                const amountClass = isWin ? 'text-green' : 'text-red';
                const itemClass = isWin ? 'item-win' : 'item-loss';

                listHistorial.innerHTML += `
                    <li class="history-item ${itemClass}">
                        <div class="item-header">
                            <div class="item-details">
                                <h4>${op.activo}</h4>
                                <p>${op.fecha_apertura} ➔ ${op.fecha_cierre}</p>
                                <p>Entrada: $${op.precio}</p>
                            </div>
                            <div class="item-amount ${amountClass}">
                                ${sign}${formatMoney(op.monto)} ARS
                            </div>
                        </div>
                    </li>
                `;
            });
        }
    }

    actualizarPantalla();
</script>
</body>
</html>
